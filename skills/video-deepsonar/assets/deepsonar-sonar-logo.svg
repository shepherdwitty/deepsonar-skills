<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sweep" x1="0.5" y1="0.5" x2="1" y2="0">
      <stop offset="0" stop-color="#35e0b0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#35e0b0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.9">
      <stop offset="0" stop-color="#102543"/>
      <stop offset="1" stop-color="#081426"/>
    </radialGradient>
  </defs>
  <!-- 深海底板 -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
  <!-- 声纳量程环 -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#24466e" stroke-width="1.4"/>
  <circle cx="32" cy="32" r="14.5" fill="none" stroke="#24466e" stroke-width="1.1"/>
  <circle cx="32" cy="32" r="7" fill="none" stroke="#24466e" stroke-width="0.9"/>
  <!-- 方位刻度 -->
  <g stroke="#2b4a73" stroke-width="1.4" stroke-linecap="round">
    <line x1="32" y1="8.2" x2="32" y2="12.4"/>
    <line x1="32" y1="51.6" x2="32" y2="55.8"/>
    <line x1="8.2" y1="32" x2="12.4" y2="32"/>
    <line x1="51.6" y1="32" x2="55.8" y2="32"/>
  </g>
  <!-- 扫描扇面与扫掠线（指向东北象限） -->
  <path d="M32 32 L32 10 A22 22 0 0 1 47.56 16.44 Z" fill="url(#sweep)"/>
  <line x1="32" y1="32" x2="47.56" y2="16.44" stroke="#35e0b0" stroke-width="2" stroke-linecap="round"/>
  <!-- 回波亮点 -->
  <circle cx="41.5" cy="23.5" r="2.2" fill="#35e0b0"/>
  <circle cx="23" cy="41" r="1.6" fill="#5b8cff" opacity="0.85"/>
  <circle cx="38.5" cy="42.5" r="1.2" fill="#35e0b0" opacity="0.5"/>
  <!-- 中心换能器 -->
  <circle cx="32" cy="32" r="3.2" fill="#35e0b0"/>
  <circle cx="32" cy="32" r="1.3" fill="#081426"/>
</svg>
